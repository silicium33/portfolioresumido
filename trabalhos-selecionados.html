<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trabalhos selecionados de cerâmica autoral de Gustavo Sirqueira.">
  <title>Trabalhos cerâmicos selecionados — Gustavo Sirqueira</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e9;
      --ink: #24231f;
      --muted: #716e67;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      max-width: 1440px;
      margin: 0 auto;
      padding: clamp(48px, 9vw, 120px) clamp(24px, 6vw, 88px) 48px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 8vw, 6rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.98;
      text-transform: uppercase;
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 clamp(24px, 6vw, 88px) 96px;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 56px 28px;
    }

    figure {
      margin: 0;
    }

    figure img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #e7e2d8;
      object-fit: cover;
    }

    .image-expand {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      cursor: zoom-in;
      text-align: left;
    }

    .image-expand:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    figcaption {
      padding-top: 14px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .image-dialog {
      position: relative;
      max-width: 94vw;
      max-height: 94vh;
      padding: 20px;
      border: 0;
      background: var(--paper);
      color: var(--ink);
    }

    .image-dialog::backdrop {
      background: rgba(20, 19, 17, 0.88);
    }

    .image-dialog__close {
      display: block;
      margin: 0 0 12px auto;
      padding: 8px 12px;
      border: 1px solid var(--muted);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .image-dialog__image {
      display: block;
      width: auto;
      max-width: calc(94vw - 40px);
      max-height: 78vh;
      aspect-ratio: auto;
      margin: 0 auto;
      object-fit: contain;
    }

    .image-dialog p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    footer {
      padding: 24px;
      border-top: 1px solid #d6d1c7;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 800px) {
      .work-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 40px 20px;
      }
    }

    @media (max-width: 520px) {
      header {
        padding-bottom: 36px;
      }

      .work-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h2>Gustavo Sirqueira</h2>
    <p>Trabalhos cerâmicos selecionados. Clique para ampliar.</p>
  </header>

  <main>
    <section class="work-grid" aria-label="Galeria de trabalhos">
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Pratos de jantar">
          <img src="ASSETS/1%20Pratos%20de%20jantar.jpeg" alt="Prato artesanal de cerâmica em uma mesa posta">
        </button>
        <figcaption>Pratos de jantar - Trabalho comissionado</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Copinhos de cerâmica">
          <img src="ASSETS/2%20-copinhos.jpg" alt="Conjunto de copinhos de cerâmica em tons de verde e amarelo">
        </button>
        <figcaption>Copinhos - Trabalho comissionado</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Detalhe da Ânfora do Morcego">
          <img src="ASSETS/3%20-%20Anfora%20do%20Morcego%20-%20detail.jpeg" alt="Detalhe da Ânfora do Morcego em cerâmica">
        </button>
        <figcaption>Ânfora do Morcego, 2025 (detalhe).</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Ânfora do Morcego">
          <img src="ASSETS/4%20-%20Anfora%20do%20Morcego.png" alt="Ânfora de cerâmica com tema de morcego">
        </button>
        <figcaption>Ânfora do Morcego, 2025.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Cachepot">
          <img src="ASSETS/5%20Cachepot.jpeg" alt="Cachepot de cerâmica">
        </button>
        <figcaption>Cachepot, 2025.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Xícaras">
          <img src="ASSETS/6%20-%20X%C3%ADcaras.jpg" alt="Conjunto de xícaras de cerâmica">
        </button>
        <figcaption>Xícaras.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Urna para Beatriz Vitterbo, 2026">
          <img src="ASSETS/7%20-%20urna%20para%20beatriz%20vitterbo%2C%202026.png" alt="Urna de cerâmica autoral para Beatriz Vitterbo, 2026">
        </button>
        <figcaption>Urna para Beatriz Vitterbo, 2026.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Solitário preto">
          <img src="ASSETS/8%20solitario-preto1.jpeg" alt="Solitário de cerâmica com acabamento preto brilhante">
        </button>
        <figcaption>Solitário preto, 2025.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Solitário verde">
          <img src="ASSETS/9%20solitario-verde1.jpeg" alt="Solitário de cerâmica com esmalte verde">
        </button>
        <figcaption>Solitário verde, 2024.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Solitário vinho">
          <img src="ASSETS/10%20solitario-vinho1.jpeg" alt="Solitário de cerâmica com acabamento em tom vinho">
        </button>
        <figcaption>Solitário vinho, 2024.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Solitário amarelo">
          <img src="ASSETS/11%20solitario-amarelo1.jpeg" alt="Solitário de cerâmica com acabamento amarelo">
        </button>
        <figcaption>Solitário amarelo, 2024.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Solitário Mishima">
          <img src="ASSETS/13%20-%20Solit%C3%A1rio%20Mishima.jpeg" alt="Solitário de cerâmica com decoração Mishima">
        </button>
        <figcaption>Solitário Mishima, 2025.</figcaption>
      </figure>
      <figure>
        <button class="image-expand" type="button" aria-label="Abrir foto ampliada: Prato Redemoinho">
          <img src="ASSETS/14%20Prato%20-%20Redemoinho.jpeg" alt="Prato de cerâmica com decoração em redemoinho">
        </button>
        <figcaption>Prato Redemoinho, 2026.</figcaption>
      </figure>
    </section>
  </main>

  <footer>Gustavo Sirqueira · Cerâmica autoral</footer>

  <dialog class="image-dialog" aria-labelledby="expanded-caption">
    <button class="image-dialog__close" type="button" aria-label="Fechar foto ampliada">Fechar</button>
    <img class="image-dialog__image" src="" alt="">
    <p id="expanded-caption"></p>
  </dialog>

  <script>
    const imageDialog = document.querySelector(".image-dialog");
    const expandedImage = imageDialog.querySelector(".image-dialog__image");
    const expandedCaption = imageDialog.querySelector("#expanded-caption");

    document.querySelectorAll(".image-expand").forEach((button) => {
      button.addEventListener("click", () => {
        const image = button.querySelector("img");
        expandedImage.src = image.currentSrc || image.src;
        expandedImage.alt = image.alt;
        expandedCaption.textContent = button.closest("figure").querySelector("figcaption").textContent;
        imageDialog.showModal();
      });
    });

    imageDialog.querySelector(".image-dialog__close").addEventListener("click", () => {
      imageDialog.close();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && imageDialog.open) {
        event.preventDefault();
        imageDialog.close();
      }
    });

    imageDialog.addEventListener("click", (event) => {
      if (event.target === imageDialog) {
        imageDialog.close();
      }
    });
  </script>
</body>
</html>
